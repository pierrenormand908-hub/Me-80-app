<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ME-80 Studio Pierrot</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --boss-orange: #ffaa00;
            --boss-blue: #00aaff;
            --boss-red: #ff4444;
            --boss-yellow: #ffff00;
            --text: #e0e0e0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0; /* On enlève le padding du body pour que l'entête colle aux bords */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ENTÊTE FIGÉE (STICKY) --- */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background-color: var(--bg);
            padding: 10px 0;
            border-bottom: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        .header h1 { 
            color: var(--boss-blue); 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            margin: 0 0 10px 0; 
        }

        .info-patch { 
            border: 2px solid var(--boss-yellow);
            background: var(--panel);
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* --- ZONE DE SCROLL --- */
        .scroll-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            box-sizing: border-box;
        }

        .pedal-section {
            background: var(--panel);
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-top: 4px solid #444;
            box-sizing: border-box;
        }

        .section-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: block;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .preamp { border-color: var(--boss-orange); }
        .eqfx2 { border-color: var(--boss-blue); }
        .reverb { border-color: var(--boss-red); }

        input[type="text"], select {
            width: 100%;
            padding: 8px;
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .input-label { display: block; font-size: 0.7rem; margin-bottom: 3px; color: #aaa; text-transform: uppercase; }

        .knobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 10px;
            justify-items: center;
        }

        .knob-group { text-align: center; }
        .knob-label { display: block; font-size: 0.6rem; text-transform: uppercase; margin-top: 5px; color: #bbb; }
        
        input[type=range] { width: 70px; cursor: pointer; }
        .value-display { font-family: monospace; color: white; font-size: 0.8rem; display: block; font-weight: bold; }

        .save-info { font-size: 0.7rem; color: #666; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="header">
            <h1>ME-80 Tone Studio</h1>
        </div>
        <div class="info-patch">
            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label class="input-label">Nom du Son :</label>
                    <input type="text" id="patchName" placeholder="Nom..." oninput="save()" style="margin-bottom:0;">
                </div>
                <div style="flex: 1;">
                    <label class="input-label">Position :</label>
                    <input type="text" id="patchPos" placeholder="U1-1" oninput="save()" style="margin-bottom:0;">
                </div>
            </div>
        </div>
    </div>

    <div class="scroll-content">
        <div class="pedal-section preamp">
            <span class="section-title" style="color: var(--boss-orange);">PREAMP</span>
            <select id="ampType" onchange="save()">
                <option value="metal">METAL</option><option value="stack">STACK</option>
                <option value="drive">DRIVE</option><option value="lead">LEAD</option>
                <option value="combo">COMBO</option><option value="crunch">CRUNCH</option>
                <option value="tweed">TWEED</option><option value="clean">CLEAN</option>
            </select>
            <div class="knobs-grid">
                <div class="knob-group"><span class="value-display" id="v-gain">50</span><input type="range" id="gain" min="0" max="100" value="50" oninput="upd('gain')"><span class="knob-label">Gain</span></div>
                <div class="knob-group"><span class="value-display" id="v-bass">50</span><input type="range" id="bass" min="0" max="100" value="50" oninput="upd('bass')"><span class="knob-label">Bass</span></div>
                <div class="knob-group"><span class="value-display" id="v-mid">50</span><input type="range" id="mid" min="0" max="100" value="50" oninput="upd('mid')"><span class="knob-label">Middle</span></div>
                <div class="knob-group"><span class="value-display" id="v-treble">50</span><input type="range" id="treble" min="0" max="100" value="50" oninput="upd('treble')"><span class="knob-label">Treble</span></div>
                <div class="knob-group"><span class="value-display" id="v-level">50</span><input type="range" id="level" min="0" max="100" value="50" oninput="upd('level')"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section eqfx2">
            <span class="section-title" style="color: var(--boss-blue);">EQ / FX2</span>
            <select id="fx2Type" onchange="save()">
                <option value="phaser">PHASER</option><option value="tremolo">TREMOLO</option>
                <option value="boost">BOOST</option><option value="delay">DELAY</option>
                <option value="eq">EQ</option>
            </select>
            <div class="knobs-grid">
                <div class="knob-group"><span class="value-display" id="v-f2-bass">50</span><input type="range" id="f2-bass" min="0" max="100" value="50" oninput="upd('f2-bass')"><span class="knob-label">Bass</span></div>
                <div class="knob-group"><span class="value-display" id="v-f2-mid">50</span><input type="range" id="f2-mid" min="0" max="100" value="50" oninput="upd('f2-mid')"><span class="knob-label">Middle</span></div>
                <div class="knob-group"><span class="value-display" id="v-f2-treble">50</span><input type="range" id="f2-treble" min="0" max="100" value="50" oninput="upd('f2-treble')"><span class="knob-label">Treble</span></div>
                <div class="knob-group"><span class="value-display" id="v-f2-level">50</span><input type="range" id="f2-level" min="0" max="100" value="50" oninput="upd('f2-level')"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section reverb">
            <span class="section-title" style="color: var(--boss-red);">REVERB</span>
            <select id="revType" onchange="save()">
                <option value="hall">HALL</option><option value="room">ROOM</option><option value="spring">SPRING</option>
            </select>
            <div class="knobs-grid" style="grid-template-columns: 1fr;">
                <div class="knob-group">
                    <span class="value-display" id="v-rev-val">0</span>
                    <input type="range" id="rev-val" min="0" max="100" value="0" oninput="upd('rev-val')" style="width: 180px;">
                    <span class="knob-label">Niveau Reverb</span>
                </div>
            </div>
        </div>

        <div id="status" class="save-info">Prêt.</div>
    </div>

    <script>
        const ids = ['gain','bass','mid','treble','level','f2-bass','f2-mid','f2-treble','f2-level','rev-val'];

        function upd(id) {
            document.getElementById('v-' + id).innerText = document.getElementById(id).value;
            save();
        }

        function save() {
            const data = {
                name: document.getElementById('patchName').value,
                pos: document.getElementById('patchPos').value,
                amp: document.getElementById('ampType').value,
                fx2: document.getElementById('fx2Type').value,
                rev: document.getElementById('revType').value,
                vals: {}
            };
            ids.forEach(id => data.vals[id] = document.getElementById(id).value);
            localStorage.setItem('me80_v4_data', JSON.stringify(data));
            document.getElementById('status').innerText = "Auto-save: " + new Date().toLocaleTimeString();
        }

        window.onload = () => {
            const saved = localStorage.getItem('me80_v4_data');
            if (saved) {
                const d = JSON.parse(saved);
                document.getElementById('patchName').value = d.name || "";
                document.getElementById('patchPos').value = d.pos || "";
                document.getElementById('ampType').value = d.amp;
                document.getElementById('fx2Type').value = d.fx2;
                document.getElementById('revType').value = d.rev;
                ids.forEach(id => {
                    if(d.vals[id]) {
                        document.getElementById(id).value = d.vals[id];
                        document.getElementById('v-' + id).innerText = d.vals[id];
                    }
                });
            }
        };
    </script>
</body>
</html>
