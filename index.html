<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ME-80 Studio Pierrot</title>
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0;
            --boss-orange: #ffaa00; --boss-blue: #00aaff; --boss-red: #ff4444;
            --boss-yellow: #ffff00; --boss-green: #00ff88; --boss-grey: #777777;
            --off: #333333;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .sticky-header { position: sticky; top: 0; z-index: 1000; width: 100%; background-color: var(--bg); padding: 10px 0; border-bottom: 2px solid #333; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .header h1 { color: var(--boss-blue); font-size: 1.1rem; text-transform: uppercase; margin: 0 0 10px 0; }
        .info-patch { border: 2px solid var(--boss-yellow); background: var(--panel); border-radius: 8px; width: 90%; max-width: 450px; padding: 10px; box-sizing: border-box; }
        .scroll-content { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; box-sizing: border-box; }
        
        .pedal-section { 
            background: var(--panel); border-radius: 12px; width: 100%; max-width: 450px; 
            padding: 15px; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            border-top: 6px solid var(--off); box-sizing: border-box; transition: all 0.3s;
            cursor: pointer;
        }
        
        .section-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 12px; display: block; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px; text-transform: uppercase; color: #555; }

        .is-on { border-top-width: 8px; }
        .is-on.preamp { border-color: var(--boss-orange); }
        .is-on.preamp .section-title { color: var(--boss-orange); }
        .is-on.comp { border-color: var(--boss-green); }
        .is-on.comp .section-title { color: var(--boss-green); }
        .is-on.odds { border-color: var(--boss-red); }
        .is-on.odds .section-title { color: var(--boss-red); }
        .is-on.mod { border-color: var(--boss-blue); }
        .is-on.mod .section-title { color: var(--boss-blue); }
        .is-on.eqfx2 { border-color: var(--boss-blue); }
        .is-on.eqfx2 .section-title { color: var(--boss-blue); }
        .is-on.delay { border-color: var(--boss-yellow); }
        .is-on.delay .section-title { color: var(--boss-yellow); }
        .is-on.reverb { border-color: var(--boss-red); }
        .is-on.reverb .section-title { color: var(--boss-red); }
        .is-on.pfx { border-color: var(--boss-orange); }
        .is-on.pfx .section-title { color: var(--boss-orange); }

        .pedal-section:not(.is-on) { opacity: 0.6; }

        .selector-container { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        .selector-container select { flex: 1; margin-bottom: 0 !important; }
        .type-num-input { width: 60px !important; text-align: center; border-color: #555 !important; color: var(--boss-yellow) !important; font-weight: bold; margin-bottom: 0 !important; }

        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 8px; background: #252525; color: white; border: 1px solid #444; border-radius: 5px; margin-bottom: 8px; font-size: 0.9rem; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--boss-yellow); color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-sec { background: #444; color: white; font-size: 0.8rem; padding: 5px; margin-top: 10px; }
        
        .knobs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(75px, 1fr)); gap: 10px; justify-items: center; }
        .knob-group { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .knob-label { display: block; font-size: 0.6rem; text-transform: uppercase; margin-top: 5px; color: #bbb; }
        input[type=range] { width: 75px; cursor: pointer; margin-bottom: 5px; }
        .value-input { width: 55px !important; text-align: center; height: 28px; padding: 2px !important; font-size: 0.8rem !important; border-color: #555 !important; color: var(--boss-yellow) !important; margin-bottom: 0 !important; }
        .mixed-input { width: 110px !important; text-align: center; border-color: #555 !important; font-weight: bold; color: var(--boss-yellow) !important; margin-top: 2px; }
        .save-info { font-size: 0.7rem; color: #666; padding-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="header"><h1>ME-80 Tone Studio</h1></div>
        <div class="info-patch">
            <select id="savedPatches" onchange="loadSelectedPatch()"><option value="">-- Nouveau Patch --</option></select>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;"><input type="text" id="patchName" placeholder="Nom du Patch"></div>
                <div style="flex: 1;"><input type="text" id="patchPos" placeholder="U1-1"></div>
            </div>
            <button onclick="saveCurrentPatch()">ENREGISTRER CE PATCH</button>
        </div>
    </div>

    <div class="scroll-content">
        <div class="pedal-section comp is-on" onclick="toggleEffet(this)">
            <span class="section-title">COMP / FX1</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="compType">
                    <option value="def">DEFRETTER</option><option value="slow">SLOW GEAR</option><option value="oct">OCTAVE</option><option value="twd">T.WAH DOWN</option><option value="twu">T.WAH UP</option><option value="comp">COMP</option><option value="ring">RING MOD</option><option value="ac">AC SIM</option><option value="sh">SINGLE HUM</option><option value="hs">HUM SINGLE</option><option value="solo">SOLO</option>
                </select>
                <input type="number" id="compType-n" class="type-num-input" placeholder="#">
            </div>
            <div class="knobs-grid" onclick="event.stopPropagation()">
                <div class="knob-group"><input type="range" id="c-sus" min="0" max="100" oninput="sync('c-sus')"><input type="number" id="c-sus-n" class="value-input" oninput="sync('c-sus',true)"><span class="knob-label">Sustain</span></div>
                <div class="knob-group"><input type="range" id="c-att" min="0" max="100" oninput="sync('c-att')"><input type="number" id="c-att-n" class="value-input" oninput="sync('c-att',true)"><span class="knob-label">Attack</span></div>
                <div class="knob-group"><input type="range" id="c-lvl" min="0" max="100" oninput="sync('c-lvl')"><input type="number" id="c-lvl-n" class="value-input" oninput="sync('c-lvl',true)"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section odds is-on" onclick="toggleEffet(this)">
            <span class="section-title">OD / DS</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="oddsType">
                    <option value="dist">DISTORTION</option><option value="tod">TURBO OD</option><option value="blues">BLUES</option><option value="ts">T-SCREAM</option><option value="ov">OVERDRIVE</option><option value="bst">BOOST</option><option value="tds">TURBO DS</option><option value="mds">METAL DS</option><option value="core">CORE</option><option value="fuzz">FUZZ</option><option value="ofuzz">OCT FUZZ</option>
                </select>
                <input type="number" id="oddsType-n" class="type-num-input" placeholder="#">
            </div>
            <div class="knobs-grid" onclick="event.stopPropagation()">
                <div class="knob-group"><input type="range" id="od-drv" min="0" max="100" oninput="sync('od-drv')"><input type="number" id="od-drv-n" class="value-input" oninput="sync('od-drv',true)"><span class="knob-label">Drive</span></div>
                <div class="knob-group"><input type="range" id="od-tne" min="0" max="100" oninput="sync('od-tne')"><input type="number" id="od-tne-n" class="value-input" oninput="sync('od-tne',true)"><span class="knob-label">Tone</span></div>
                <div class="knob-group"><input type="range" id="od-lvl" min="0" max="100" oninput="sync('od-lvl')"><input type="number" id="od-lvl-n" class="value-input" oninput="sync('od-lvl',true)"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section preamp is-on" onclick="toggleEffet(this)">
            <span class="section-title">PREAMP</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="ampType">
                    <option value="ac">AC</option><option value="metal">METAL</option><option value="stack">STACK</option><option value="drive">DRIVE</option><option value="lead">LEAD</option><option value="combo">COMBO</option><option value="crunch">CRUNCH</option><option value="tweed">TWEED</option><option value="clean">CLEAN</option>
                </select>
                <input type="number" id="ampType-n" class="type-num-input" placeholder="#">
            </div>
            <div class="knobs-grid" onclick="event.stopPropagation()">
                <div class="knob-group"><input type="range" id="gain" min="0" max="100" oninput="sync('gain')"><input type="number" id="gain-n" class="value-input" oninput="sync('gain',true)"><span class="knob-label">Gain</span></div>
                <div class="knob-group"><input type="range" id="bass" min="0" max="100" oninput="sync('bass')"><input type="number" id="bass-n" class="value-input" oninput="sync('bass',true)"><span class="knob-label">Bass</span></div>
                <div class="knob-group"><input type="range" id="mid" min="0" max="100" oninput="sync('mid')"><input type="number" id="mid-n" class="value-input" oninput="sync('mid',true)"><span class="knob-label">Middle</span></div>
                <div class="knob-group"><input type="range" id="treble" min="0" max="100" oninput="sync('treble')"><input type="number" id="treble-n" class="value-input" oninput="sync('treble',true)"><span class="knob-label">Treble</span></div>
                <div class="knob-group"><input type="range" id="level" min="0" max="100" oninput="sync('level')"><input type="number" id="level-n" class="value-input" oninput="sync('level',true)"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section mod is-on" onclick="toggleEffet(this)">
            <span class="section-title">MODULATION</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="modType">
                    <option value="pit">PITCH SHIFT</option><option value="vib">VIBRATO</option><option value="cho">CHORUS</option><option value="tre">TREMOLO</option><option value="fla">FLANGER</option><option value="pha">PHASER</option><option value="har">HARMONIST</option><option value="rot">ROTARY</option><option value="uni">UNI-V</option><option value="dly">DELAY</option><option value="ove">OVERTONE</option>
                </select>
                <input type="number" id="modType-n" class="type-num-input" placeholder="#">
            </div>
            <div class="knobs-grid" onclick="event.stopPropagation()">
                <div class="knob-group">
                    <input type="range" id="m-rate" min="0" max="100" oninput="syncRate(false)">
                    <input type="text" id="m-rate-t" class="mixed-input" placeholder="0-100 / texte" oninput="syncRate(true)">
                    <span class="knob-label">Rate</span>
                </div>
                <div class="knob-group"><input type="range" id="m-dep" min="0" max="100" oninput="sync('m-dep')"><input type="number" id="m-dep-n" class="value-input" oninput="sync('m-dep',true)"><span class="knob-label">Depth</span></div>
                <div class="knob-group"><input type="range" id="m-lvl" min="0" max="100" oninput="sync('m-lvl')"><input type="number" id="m-lvl-n" class="value-input" oninput="sync('m-lvl',true)"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section eqfx2 is-on" onclick="toggleEffet(this)">
            <span class="section-title">EQ / FX2</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="fx2Type">
                    <option value="pha">PHASER</option><option value="tre">TREMOLO</option><option value="bst">BOOST</option><option value="dly">DELAY</option><option value="cho">CHORUS</option><option value="eq">EQ</option>
                </select>
                <input type="number" id="fx2Type-n" class="type-num-input" placeholder="#">
            </div>
            <div class="knobs-grid" onclick="event.stopPropagation()">
                <div class="knob-group"><input type="range" id="f2-bass" min="0" max="100" oninput="sync('f2-bass')"><input type="number" id="f2-bass-n" class="value-input" oninput="sync('f2-bass',true)"><span class="knob-label">Bass</span></div>
                <div class="knob-group"><input type="range" id="f2-mid" min="0" max="100" oninput="sync('f2-mid')"><input type="number" id="f2-mid-n" class="value-input" oninput="sync('f2-mid',true)"><span class="knob-label">Middle</span></div>
                <div class="knob-group"><input type="range" id="f2-treble" min="0" max="100" oninput="sync('f2-treble')"><input type="number" id="f2-treble-n" class="value-input" oninput="sync('f2-treble',true)"><span class="knob-label">Treble</span></div>
                <div class="knob-group"><input type="range" id="f2-level" min="0" max="100" oninput="sync('f2-level')"><input type="number" id="f2-level-n" class="value-input" oninput="sync('f2-level',true)"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section delay is-on" onclick="toggleEffet(this)">
            <span class="section-title">DELAY</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="dlyType">
                    <option value="mod">MODULATE</option><option value="tap">TAPE</option><option value="ana">ANALOG</option><option value="6000">500-6000ms</option><option value="600">100-600ms</option><option value="99">1-99ms</option><option value="rev">REVERSE</option><option value="cho">CHO+DELAY</option><option value="tem">TEMPO</option><option value="ter">TERA ECHO</option><option value="loo">PHRASE LOOP</option>
                </select>
                <input type="number" id="dlyType-n" class="type-num-input" placeholder="#">
            </div>
            <div class="knobs-grid" onclick="event.stopPropagation()">
                <div class="knob-group">
                    <input type="range" id="d-time" min="1" max="6000" step="1" oninput="syncDelay(false)">
                    <input type="text" id="d-time-t" class="mixed-input" placeholder="ms / texte" oninput="syncDelay(true)">
                    <span class="knob-label">Time</span>
                </div>
                <div class="knob-group"><input type="range" id="d-fdb" min="0" max="100" oninput="sync('d-fdb')"><input type="number" id="d-fdb-n" class="value-input" oninput="sync('d-fdb',true)"><span class="knob-label">Feedback</span></div>
                <div class="knob-group"><input type="range" id="d-lvl" min="0" max="100" oninput="sync('d-lvl')"><input type="number" id="d-lvl-n" class="value-input" oninput="sync('d-lvl',true)"><span class="knob-label">Level</span></div>
            </div>
        </div>

        <div class="pedal-section reverb is-on" onclick="toggleEffet(this)">
            <span class="section-title">REVERB & MASTER</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="revType"><option value="hal">HALL</option><option value="roo">ROOM</option><option value="spr">SPRING</option></select>
                <input type="number" id="revType-n" class="type-num-input" placeholder="#">
            </div>
            <div class="knobs-grid" onclick="event.stopPropagation()">
                <div class="knob-group"><input type="range" id="rev-val" min="0" max="100" oninput="sync('rev-val')"><input type="number" id="rev-val-n" class="value-input" oninput="sync('rev-val',true)"><span class="knob-label">Reverb</span></div>
                <div class="knob-group"><input type="range" id="out-lvl" min="0" max="100" oninput="sync('out-lvl')"><input type="number" id="out-lvl-n" class="value-input" oninput="sync('out-lvl',true)"><span class="knob-label">Output L</span></div>
            </div>
        </div>

        <div class="pedal-section pfx is-on" onclick="toggleEffet(this)">
            <span class="section-title">PEDAL FX</span>
            <div class="selector-container" onclick="event.stopPropagation()">
                <select id="pfxType">
                    <option value="fre">FREEZE</option><option value="-1">-1 OCT</option><option value="+2">+2 OCT</option><option value="+1">+1 OCT</option><option value="voi">VOICE</option><option value="wah">WAH</option><option value="osc">OSC DELAY</option><option value="ods">OD/DS</option><option value="rat">MOD RATE</option><option value="lev">DELAY LEVEL</option>
                </select>
                <input type="number" id="pfxType-n" class="type-num-input" placeholder="#">
            </div>
        </div>

        <div class="pedal-section" style="border-top: 2px dashed #666; cursor: default;">
            <span class="section-title" style="color: white;">Sauvegarde / Export</span>
            <textarea id="io-box" rows="2" placeholder="Colle ton texte ici..."></textarea>
            <div style="display: flex; gap: 8px;">
                <button onclick="exportLib()" class="btn-sec">EXPORTER</button>
                <button onclick="importLib()" class="btn-sec" style="background: var(--boss-green); color: black;">IMPORTER</button>
            </div>
        </div>

        <div id="status" class="save-info">Pret.</div>
    </div>

    <script>
        const knobIds = ['c-sus','c-att','c-lvl','od-drv','od-tne','od-lvl','gain','bass','mid','treble','level','m-dep','m-lvl','f2-bass','f2-mid','f2-treble','f2-level','d-fdb','d-lvl','rev-val','out-lvl'];
        const typeIds = ['compType', 'oddsType', 'ampType', 'modType', 'fx2Type', 'dlyType', 'revType', 'pfxType'];
        let myLibrary = JSON.parse(localStorage.getItem('me80_lib_v9')) || {};

        function toggleEffet(el) { el.classList.toggle('is-on'); }
        function sync(id, fromInput = false) {
            const range = document.getElementById(id);
            const num = document.getElementById(id + '-n');
            if (fromInput) range.value = num.value;
            else if(num) num.value = range.value;
        }
        function syncDelay(fromText) {
            const range = document.getElementById('d-time');
            const text = document.getElementById('d-time-t');
            if (fromText && !isNaN(text.value) && text.value !== "") range.value = text.value;
            else if (!fromText) text.value = range.value;
        }
        function syncRate(fromText) {
            const range = document.getElementById('m-rate');
            const text = document.getElementById('m-rate-t');
            if (fromText && !isNaN(text.value) && text.value !== "") range.value = text.value;
            else if (!fromText) text.value = range.value;
        }

        function saveCurrentPatch() {
            const name = document.getElementById('patchName').value || "Sans titre";
            const data = {
                name: name, pos: document.getElementById('patchPos').value,
                dTime: document.getElementById('d-time-t').value,
                mRateText: document.getElementById('m-rate-t').value,
                vals: {}, types: {}, states: {}
            };
            knobIds.forEach(id => data.vals[id] = document.getElementById(id).value);
            typeIds.forEach(tId => {
                data.types[tId] = { val: document.getElementById(tId).value, num: document.getElementById(tId + '-n').value };
            });
            document.querySelectorAll('.pedal-section').forEach(sec => {
                const types = ['preamp','comp','odds','mod','eqfx2','delay','reverb','pfx'];
                types.forEach(t => { if(sec.classList.contains(t)) data.states[t] = sec.classList.contains('is-on'); });
            });
            myLibrary[name] = data;
            localStorage.setItem('me80_lib_v9', JSON.stringify(myLibrary));
            updateMenu();
        }

        function updateMenu() {
            const menu = document.getElementById('savedPatches');
            menu.innerHTML = '<option value="">-- Nouveau Patch --</option>';
            Object.keys(myLibrary).forEach(n => {
                const opt = document.createElement('option'); opt.value = n;
                opt.innerText = n + (myLibrary[n].pos ? " ["+myLibrary[n].pos+"]" : "");
                menu.appendChild(opt);
            });
        }

        function loadSelectedPatch() {
            const n = document.getElementById('savedPatches').value; if (!n) return;
            const d = myLibrary[n];
            document.getElementById('patchName').value = d.name;
            document.getElementById('patchPos').value = d.pos || "";
            typeIds.forEach(tId => {
                if(d.types && d.types[tId]) {
                    document.getElementById(tId).value = d.types[tId].val;
                    document.getElementById(tId + '-n').value = d.types[tId].num || "";
                }
            });
            document.getElementById('d-time-t').value = d.dTime || "";
            document.getElementById('d-time').value = !isNaN(d.dTime) ? d.dTime : 50;
            document.getElementById('m-rate-t').value = d.mRateText || d.vals['m-rate'] || "50";
            document.getElementById('m-rate').value = !isNaN(document.getElementById('m-rate-t').value) ? document.getElementById('m-rate-t').value : 50;
            knobIds.forEach(id => {
                if (d.vals && d.vals[id]) { document.getElementById(id).value = d.vals[id]; document.getElementById(id + '-n').value = d.vals[id]; }
            });
            if(d.states) { Object.keys(d.states).forEach(k => { applyState('.' + k, d.states[k]); }); }
        }

        function applyState(selector, isOn) {
            const el = document.querySelector(selector);
            if(el) { if(isOn) el.classList.add('is-on'); else el.classList.remove('is-on'); }
        }

        function exportLib() {
            document.getElementById('io-box').value = "Mes Patches ME-80 " + JSON.stringify(myLibrary);
            document.getElementById('io-box').select();
            document.execCommand('copy');
            alert("Bibliothèque copiée !");
        }

        function importLib() {
            try {
                let raw = document.getElementById('io-box').value;
                // Nettoyage automatique du texte
                let clean = raw.substring(raw.indexOf('{')); 
                myLibrary = JSON.parse(clean);
                localStorage.setItem('me80_lib_v9', JSON.stringify(myLibrary));
                updateMenu();
                alert("Importation réussie ! Vos " + Object.keys(myLibrary).length + " sons sont là.");
            } catch(e) { alert("Erreur de format. Assure-toi de copier tout le texte."); }
        }
        window.onload = updateMenu;
    </script>
</body>
</html>
